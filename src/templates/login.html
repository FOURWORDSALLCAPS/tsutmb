<!DOCTYPE html>
{% load static %}
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход</title>
    <link rel="stylesheet" href="{% static 'login/css/tgu.css' %}">
    <link rel="stylesheet" href="{% static 'login/css/animate.css' %}">
    <link rel="stylesheet" href="{% static 'login/assets/2b564f1b/css/bootstrap.css' %}">
    <link rel="stylesheet" href="{% static 'login/css/style.css' %}">
    <link rel="stylesheet" href="{% static 'login/css/main.css' %}">
</head>

<body>
    <div id="wrapper">
        <div class="content" id="content-main">
            <div class="container">
                <div class="site-index content">
                    <div class="body-content">
                        <div class="site-login">
                            <div id="logos" class="col-xs-12 text-center" style="padding: 25px;">
                                <div class="preloader-wrapper">
                                    <span id="rotag" class="preloader-s"></span>
                                        <img src="{% static 'login/img/playlogo.svg' %}" id="playlogo" style="height: 180px;width: 180px;position: relative; top: 45px; display: inline-block; visibility: visible; animation-delay: .1s; animation-duration: 1.5s; ">
                                </div>
                            </div>
                            <div class="row" id="login">
                                <div class="form-group d-flex flex-row flex-wrap justify-content-between col-lg-10 offset-lg-1 col-sm-12">
                                    <h4 style="border-bottom: 2px #e7c782 solid;">Личный кабинет</h4>
                                </div>
                                <div class="col-lg-10 offset-lg-1 col-sm-12">
                                    <form id="login-form" class="form-vertical kv-form-bs4" method="post" role="form">
                                        {% csrf_token %}

                                        {% if form.errors %}
                                        <div class="alert alert-danger">
                                            <strong>Ошибка:</strong>
                                            {% for field, errors in form.errors.items %}
                                                {% for error in errors %}
                                                    {{ error }}<br>
                                                {% endfor %}
                                            {% endfor %}
                                        </div>
                                        {% endif %}

                                        <div class="form-group highlight-addon field-loginform-identity required">
                                            <label class="has-star" for="loginform-identity">Имя пользователя</label>
                                            <input type="text" id="loginform-identity" class="form-control" name="username" aria-required="true">
                                        </div>
                                        <div class="form-group highlight-addon field-loginform-password required">
                                            <label class="has-star" for="loginform-password">Пароль</label>
                                            <input type="password" id="loginform-password" class="form-control" name="password" aria-required="true">
                                        </div>
                                        <div class="form-group d-flex justify-content-between">
                                            <button type="submit" class="btn btn-primary font-weight-bold my-auto w-100" name="login-button">Вход</button>
                                        </div>
                                        <div class="form-group d-flex justify-content-between">
                                            <a href="{% url 'tgu:view_register' %}" class="btn btn-primary font-weight-bold my-auto w-100">
                                                Зарегистрироваться
                                            </a>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="{% static 'login/js/axios.min.js' %}"></script>
</body>
</html>
